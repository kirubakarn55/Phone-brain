<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.json">
  <title>Phone Brain</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body onload="import('./script.js')">
  <div id="cyber-bg"></div>
  <div class="grid-overlay"></div>
  <div class="scanline"></div>
  <div class="container">
    <header class="header"><h1>Phone Brain</h1><div class="subtitle">Neural Interface v2.0</div></header>
    <div class="status-bar">
      <span id="connection-status-wrap"><span class="status-dot" id="status-dot"></span><span id="connection-status">Online</span></span>
      <span id="status-mode">Mode: Normal</span>
    </div>
    <div class="glass-card">
      <div class="card-label">System Clock</div>
      <div class="clock-display"><div class="clock-time" id="clock-time">00:00:00</div><div class="clock-date" id="clock-date">---</div><div class="clock-seconds-bar"><div class="clock-seconds-fill" id="seconds-fill"></div></div></div>
    </div>
    <div class="glass-card">
      <div class="card-label">System Metrics</div>
      <div class="stats-grid">
        <div class="stat-box"><div class="stat-icon">🔋</div><div class="stat-value battery-val" id="battery-val">--%</div><div class="stat-label">Battery</div><div class="stat-bar"><div class="stat-bar-fill battery-fill" id="battery-fill"></div></div></div>
        <div class="stat-box"><div class="stat-icon">⚙</div><div class="stat-value cpu-val" id="cpu-val">N/A</div><div class="stat-label">CPU Load</div><div class="stat-bar"><div class="stat-bar-fill cpu-fill" id="cpu-fill"></div></div></div>
        <div class="stat-box"><div class="stat-icon">💾</div><div class="stat-value ram-val" id="ram-val">N/A</div><div class="stat-label">RAM Usage</div><div class="stat-bar"><div class="stat-bar-fill ram-fill" id="ram-fill"></div></div></div>
        <div class="stat-box"><div class="stat-icon">🌐</div><div class="stat-value" id="mode-val" style="font-size:14px;">Normal</div><div class="stat-label">Active Mode</div><div id="mode-status" class="mode-status"></div></div>
      </div>
    </div>
    <div class="glass-card">
      <div class="card-label">Mode Control</div>
      <div class="mode-grid"><button class="mode-btn gaming" id="gaming-btn" type="button"><span class="mode-icon">🎮</span>Gaming</button><button class="mode-btn study" id="study-btn" type="button"><span class="mode-icon">📚</span>Study</button></div>
    </div>
    <div class="glass-card">
      <div class="card-label">Voice Interface</div>
      <div class="voice-btn-container"><button class="voice-btn" id="voice-btn" type="button"><div class="voice-waves"><div class="voice-wave"></div><div class="voice-wave"></div><div class="voice-wave"></div><div class="voice-wave"></div><div class="voice-wave"></div></div>Voice Command</button></div>
    </div>
    <div class="glass-card assistant-panel" id="assistant-panel">
      <div class="card-label">Assistant Console</div>
      <div class="assistant-conversation" id="assistant-conversation" aria-live="polite" aria-label="Conversation history"></div>
      <form class="assistant-form" id="assistant-form">
        <label class="sr-only" for="assistant-input">Ask Phone Brain</label>
        <input id="assistant-input" type="text" autocomplete="off" placeholder="Ask Phone Brain...">
        <button id="assistant-send" type="submit">Send</button>
      </form>
      <div class="assistant-actions"><button class="assistant-action-btn" id="assistant-voice-btn" type="button">Voice Input</button><button class="assistant-action-btn" id="clear-history-btn" type="button">Clear History</button></div>
    </div>
    <div class="glass-card"><div class="card-label">System Log</div><div class="sys-log" id="sys-log"></div></div>
  </div>
  <div class="ai-orb-container"><div class="ai-orb"><div class="ai-orb-inner"></div></div></div>
  <div class="ai-chat" id="ai-chat" aria-live="polite"></div>
  
</body>
</html>
